                return (
                    <>
                        <div className={`fixed inset-0 bg-black/60 z-40 transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={onClose} />
                        <aside className={`fixed top-0 left-0 h-full w-[80%] max-w-xs z-50 transform transition-transform duration-300 ease-out ${isOpen ? 'translate-x-0' : '-translate-x-full'} ${darkMode ? 'bg-stone-900 text-stone-300' : 'bg-stone-100 text-stone-700'} shadow-2xl flex flex-col`}>
                            <div className="p-4 flex justify-between items-center border-b border-stone-200 dark:border-stone-800 h-16 flex-shrink-0"><span className="font-serif font-bold text-lg">章節導讀</span><button onClick={onClose} className="p-2 hover:bg-stone-200 dark:hover:bg-stone-800 rounded-full transition"><Icons.X size={20} /></button></div>
                            <div className="p-2 border-b border-stone-200 dark:border-stone-800">
                                <button onClick={onFullSutra} className={`w-full p-3 rounded-xl flex items-center gap-3 transition-all ${fullSutraMode ? 'bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-400 font-bold' : 'hover:bg-stone-200 dark:hover:bg-stone-800'}`}>
                                    <Icons.Scroll size={18} /><span className="font-serif">全卷誦讀</span>
                                </button>
                            </div>
                            <div className="overflow-y-auto flex-1 p-3 no-scrollbar pb-20" ref={sidebarRef}>
                                {chapters.map((chapter) => (
                                    <button key={chapter.id} data-active={currentId === chapter.id && !fullSutraMode} onClick={() => onSelect(chapter.id)} className={`w-full text-left p-4 rounded-xl mb-2 transition-all duration-200 active:scale-[0.98] ${currentId === chapter.id && !fullSutraMode ? (darkMode ? 'bg-stone-800 text-amber-500' : 'bg-white text-amber-700 shadow-sm') : 'hover:bg-stone-200/50 dark:hover:bg-stone-800'}`}>
                                        <div className="flex items-center justify-between"><span className={`text-base font-serif ${currentId === chapter.id && !fullSutraMode ? 'font-bold' : ''}`}>{chapter.id === 0 ? chapter.title : `${chapter.id}. ${chapter.title.split(' ')[1] || chapter.title}`}</span>{currentId === chapter.id && !fullSutraMode && <Icons.ChevronRight size={16} />}</div>
                                    </button>
                                ))}
                            </div>
                            <div className="p-4 border-t border-stone-200 dark:border-stone-800 text-center text-xs text-stone-400 font-mono">v2.3.0 • 覺</div>
                        </aside>
                    </>
                );
            };

            const currentChapter = sutraData.find(c => c.id === currentChapterId) || sutraData[0];
            const currentIndex = sutraData.findIndex(c => c.id === currentChapterId);
            const handleNext = () => { if (currentIndex < sutraData.length - 1) setCurrentChapterId(sutraData[currentIndex + 1].id); };
            const handlePrev = () => { if (currentIndex > 0) setCurrentChapterId(sutraData[currentIndex - 1].id); };

            const Header = ({ toggleSidebar, darkMode, toggleTheme, onInstallClick, zenMode, toggleZen, fullSutraMode }) => (
                <header className={`fixed top-0 w-full z-40 transition-colors duration-300 ${darkMode ? 'bg-stone-900/95 text-stone-200 border-b border-stone-800' : 'bg-stone-50/95 text-stone-800 border-b border-stone-200'} h-14 md:h-16 flex items-center justify-between px-3 shadow-sm backdrop-blur-md`}>
                    <div className="flex items-center gap-2">
                        <button onClick={toggleSidebar} className="p-2 rounded-full active:scale-90 transition-transform"><Icons.Menu size={22} /></button>
                        <h1 className="text-lg md:text-xl font-serif font-bold tracking-widest">金剛經・覺</h1>
                    </div>
                    <div className="flex items-center gap-1">
                        {!fullSutraMode && (
                            <button onClick={toggleZen} className={`p-2 rounded-full active:scale-90 transition-all duration-300 ${zenMode ? 'bg-amber-100 text-amber-600 dark:bg-amber-900 dark:text-amber-400' : 'hover:bg-stone-200/50 dark:hover:bg-stone-800'}`}>
                                {zenMode ? <Icons.Eye size={20} /> : <Icons.EyeOff size={20} />}
                            </button>
                        )}
                        <button onClick={onInstallClick} className="p-2 rounded-full active:scale-90 transition-transform"><Icons.Download size={20} /></button>
                        <button onClick={toggleTheme} className="p-2 rounded-full active:scale-90 transition-transform">{darkMode ? <Icons.Sun size={20} /> : <Icons.Moon size={20} />}</button>
                    </div>
                </header>
            );

            return (
                <div className={`min-h-screen transition-colors duration-300 font-sans ${darkMode ? 'text-stone-100' : 'text-stone-800'}`}>
                    <Header toggleSidebar={() => setSidebarOpen(!sidebarOpen)} darkMode={darkMode} toggleTheme={() => setDarkMode(!darkMode)} onInstallClick={() => setInstallModalOpen(false)} zenMode={zenMode} toggleZen={() => setZenMode(!zenMode)} fullSutraMode={fullSutraMode} />
                    <Sidebar isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} chapters={sutraData} currentId={currentChapterId} onSelect={(id) => { setCurrentChapterId(id); setFullSutraMode(false); setSidebarOpen(false); }} darkMode={darkMode} onFullSutra={() => { setFullSutraMode(true); setSidebarOpen(false); }} />

                    <main className={`pt-16 pb-32 no-scrollbar`}>
                        <ReaderContent chapter={currentChapter} darkMode={darkMode} fontSize={fontSize} zenMode={zenMode} fullSutraMode={fullSutraMode} />
                    </main>

                    {/* 下方功能列 (Responsive Adjusted Layout) */}
                    {!fullSutraMode && (
                        <div className={`fixed bottom-0 left-0 w-full px-4 py-3 md:p-4 pb-6 md:pb-8 z-30 transition-colors duration-300 ${darkMode ? 'bg-stone-900 border-t border-stone-800' : 'bg-white border-t border-stone-100'} shadow-[0_-2px_10px_rgba(0,0,0,0.03)]`}>
                            <div className="max-w-3xl mx-auto w-full flex justify-between items-center gap-2 md:gap-4">
                                {/* Previous Button */}
                                <button onClick={handlePrev} disabled={currentIndex === 0} className={`p-2.5 md:p-3 rounded-full transition active:scale-90 ${currentIndex === 0 ? 'opacity-0 pointer-events-none' : (darkMode ? 'bg-stone-800 text-stone-400' : 'bg-stone-100 text-stone-400')}`}><Icons.ChevronLeft size={22} /></button>

                                {/* Font Adjustments */}
                                {!zenMode && (
                                    <div className="flex bg-stone-100 dark:bg-stone-800 p-0.5 md:p-1 rounded-xl">
                                        <button onClick={() => setFontSize(Math.max(16, fontSize - 2))} className={`px-4 md:px-6 py-1.5 md:py-2 text-xs md:text-sm font-bold border-r border-stone-200 dark:border-stone-700 ${darkMode ? 'text-stone-300' : 'text-stone-700'} active:bg-stone-200 dark:active:bg-stone-700 transition-colors`}>A-</button>
                                        <button onClick={() => setFontSize(Math.min(32, fontSize + 2))} className={`px-4 md:px-6 py-1.5 md:py-2 text-xs md:text-sm font-bold ${darkMode ? 'text-stone-300' : 'text-stone-700'} active:bg-stone-200 dark:active:bg-stone-700 transition-colors`}>A+</button>
                                    </div>
                                )}

                                {/* Next Button */}
                                <button onClick={handleNext} disabled={currentIndex === sutraData.length - 1} className={`flex items-center justify-center min-w-[100px] md:min-w-[140px] px-6 md:px-10 py-2.5 md:py-3 rounded-full transition font-bold active:scale-95 shadow-md ${currentIndex === sutraData.length - 1 ? 'opacity-0 pointer-events-none' : 'bg-amber-700 text-white'}`}>
                                    <span className="text-sm md:text-base">{currentChapterId === 32 ? '圓滿' : '下一品'}</span>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
