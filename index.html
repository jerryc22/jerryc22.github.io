                                ))}
                            </div>
                            <div className="p-4 border-t border-stone-200 dark:border-stone-800 text-center">
                                <span className="text-xs text-stone-400 font-mono">v2.0.0 • 覺</span>
                            </div>
                        </aside>
                    </>
                );
            };

            const currentChapter = sutraData.find(c => c.id === currentChapterId) || sutraData[0];
            const currentIndex = sutraData.findIndex(c => c.id === currentChapterId);
            const handleNext = () => { if (currentIndex < sutraData.length - 1) setCurrentChapterId(sutraData[currentIndex + 1].id); };
            const handlePrev = () => { if (currentIndex > 0) setCurrentChapterId(sutraData[currentIndex - 1].id); };

            const Header = ({ toggleSidebar, darkMode, toggleTheme, onInstallClick, zenMode, toggleZen, fullSutraMode }) => (
                <header className={`fixed top-0 w-full z-40 transition-colors duration-300 noselect ${darkMode ? 'bg-stone-900/95 text-stone-200 border-b border-stone-800' : 'bg-stone-50/95 text-stone-800 border-b border-stone-200'} h-14 md:h-16 flex items-center justify-between px-3 md:px-4 shadow-sm backdrop-blur-md`}>
                    <div className="flex items-center gap-2">
                        <button onClick={toggleSidebar} className="p-2 rounded-full hover:bg-stone-200/50 dark:hover:bg-stone-800 active:scale-90 transition-transform"><Icons.Menu size={22} /></button>
                        <h1 className="text-lg md:text-xl font-serif font-bold tracking-widest">金剛經・覺</h1>
                    </div>
                    <div className="flex items-center gap-1">
                        {!fullSutraMode && (
                            <button 
                                onClick={toggleZen} 
                                className={`p-2 rounded-full active:scale-90 transition-all duration-300 ${zenMode ? 'bg-amber-100 text-amber-600 dark:bg-amber-900 dark:text-amber-400' : 'hover:bg-stone-200/50 dark:hover:bg-stone-800'}`}
                            >
                                {zenMode ? <Icons.Eye size={20} /> : <Icons.EyeOff size={20} />}
                            </button>
                        )}
                        <button onClick={onInstallClick} className="p-2 rounded-full hover:bg-stone-200/50 dark:hover:bg-stone-800 active:scale-90 transition-transform"><Icons.Download size={20} /></button>
                        <button onClick={toggleTheme} className="p-2 rounded-full hover:bg-stone-200/50 dark:hover:bg-stone-800 active:scale-90 transition-transform">{darkMode ? <Icons.Sun size={20} /> : <Icons.Moon size={20} />}</button>
                    </div>
                </header>
            );

            const InstallGuideModal = ({ isOpen, onClose, darkMode }) => {
                if (!isOpen) return null;
                return (
                    <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                        <div className={`w-full max-w-sm rounded-2xl p-6 relative ${darkMode ? 'bg-stone-800 text-stone-200' : 'bg-white text-stone-800'}`} onClick={(e) => e.stopPropagation()}>
                            <button onClick={onClose} className="absolute top-4 right-4 opacity-50 hover:opacity-100 p-2"><Icons.X size={20} /></button>
                            <h3 className="text-lg font-bold mb-1 text-center">安裝 App</h3>
                            <div className="space-y-4 text-sm mt-4">
                                <p>將此網頁加入主畫面，即可離線使用。</p>
                                <ul className="list-disc pl-5 opacity-80 space-y-2">
                                    <li><strong>iOS:</strong> 分享 > 加入主畫面</li>
                                    <li><strong>Android:</strong> 選單 > 安裝應用程式</li>
                                </ul>
                            </div>
                            <button onClick={onClose} className="w-full mt-6 py-3 bg-amber-600 text-white rounded-xl">知道了</button>
                        </div>
                    </div>
                );
            };
            const QuoteCard = ({ darkMode }) => (
                <div className={`my-6 mx-4 md:mx-auto max-w-lg p-6 text-center rounded-2xl relative overflow-hidden shadow-lg ${darkMode ? 'bg-stone-800 text-stone-300' : 'bg-stone-900 text-stone-200'}`}>
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>
                    <p className="font-serif text-lg md:text-2xl italic mb-4 relative z-10 leading-relaxed">凡所有相，皆是虛妄。<br/>若見諸相非相，即見如來。</p>
                    <p className="text-[10px] uppercase tracking-[0.2em] opacity-60">金剛經・第五品</p>
                </div>
            );
            const BreathingExercise = ({ onClose }) => {
                const [text, setText] = useState('吸氣');
                const [scale, setScale] = useState(1);
                useEffect(() => {
                    let mounted = true;
                    const run = async () => {
                        while(mounted) {
                            setText('吸氣'); setScale(1.5); await new Promise(r=>setTimeout(r,4000));
                            if(!mounted) break; setText('止息'); await new Promise(r=>setTimeout(r,2000));
                            if(!mounted) break; setText('呼氣'); setScale(1); await new Promise(r=>setTimeout(r,6000));
                        }
                    };
                    run();
                    return () => { mounted = false; };
                }, []);
                return (
                    <div className="fixed inset-0 z-[70] flex flex-col items-center justify-center bg-black/95 text-white backdrop-blur-md" onClick={onClose}>
                        <div className="w-32 h-32 rounded-full border border-white/20 flex items-center justify-center transition-all duration-[4000ms] ease-in-out" style={{transform: `scale(${scale})`}}>
                            <div className="w-2 h-2 bg-white rounded-full shadow-[0_0_20px_white]"></div>
                        </div>
                        <h2 className="text-3xl font-serif mt-8 tracking-widest">{text}</h2>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen transition-colors duration-300 font-sans ${darkMode ? 'text-stone-100' : 'text-stone-800'}`}>
                    <Header 
                        toggleSidebar={() => setSidebarOpen(!sidebarOpen)} 
                        darkMode={darkMode} 
                        toggleTheme={() => setDarkMode(!darkMode)} 
                        onInstallClick={() => setInstallModalOpen(true)}
                        zenMode={zenMode}
                        toggleZen={() => setZenMode(!zenMode)}
                        fullSutraMode={fullSutraMode}
                    />
                    <Sidebar 
                        isOpen={sidebarOpen} 
                        onClose={() => setSidebarOpen(false)} 
                        chapters={sutraData} 
                        currentId={currentChapterId} 
                        onSelect={(id) => { setCurrentChapterId(id); setFullSutraMode(false); setSidebarOpen(false); }} 
                        darkMode={darkMode}
                        onFullSutra={() => { setFullSutraMode(true); setSidebarOpen(false); }}
                    />
                    <InstallGuideModal isOpen={installModalOpen} onClose={() => setInstallModalOpen(false)} darkMode={darkMode} />
                    {showBreathing && <BreathingExercise onClose={() => setShowBreathing(false)} />}

                    <main className={`pt-16 pb-32 no-scrollbar`}>
                        {currentChapterId === 1 && !zenMode && !fullSutraMode && (
                            <div className="max-w-3xl mx-auto px-4 mb-6 mt-4">
                                <div onClick={() => setShowBreathing(true)} className={`p-5 rounded-2xl flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer ${darkMode ? 'bg-indigo-900/20 border border-indigo-500/20' : 'bg-white border border-indigo-100 shadow-sm'}`}>
                                    <div><h3 className={`font-bold mb-1 text-sm ${darkMode ? 'text-indigo-300' : 'text-indigo-800'}`}>心浮氣躁？</h3><p className={`text-xs ${darkMode ? 'text-indigo-400' : 'text-indigo-600'}`}>花一分鐘，調整呼吸</p></div>
                                    <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-none"><Icons.Wind size={20} /></div>
                                </div>
                            </div>
                        )}
                        {currentChapterId === 5 && !zenMode && !fullSutraMode && <QuoteCard darkMode={darkMode} />}
                        
                        <ReaderContent 
                            chapter={currentChapter} 
                            darkMode={darkMode} 
                            fontSize={fontSize} 
                            zenMode={zenMode}
                            fullSutraMode={fullSutraMode}
                        />
                    </main>

                    {!fullSutraMode && (
                        <div className={`fixed bottom-0 left-0 w-full p-4 pb-8 z-30 transition-transform duration-300 ${darkMode ? 'bg-stone-900/90 border-t border-stone-800' : 'bg-stone-50/90 border-t border-stone-200'} backdrop-blur-lg flex justify-between items-center ${zenMode ? 'opacity-50 hover:opacity-100' : ''}`}>
                            <div className="max-w-3xl mx-auto w-full flex justify-between items-center gap-4">
                                <button onClick={handlePrev} disabled={currentIndex === 0} className={`p-3 rounded-full transition active:scale-90 ${currentIndex === 0 ? 'opacity-0 pointer-events-none' : (darkMode ? 'bg-stone-800 text-stone-400' : 'bg-stone-200 text-stone-600')}`}><Icons.ChevronLeft size={24} /></button>
                                {!zenMode && (
                                    <div className="flex gap-1 bg-stone-200/50 dark:bg-stone-800/50 p-1 rounded-lg noselect">
                                        <button onClick={() => setFontSize(Math.max(16, fontSize - 2))} className={`px-4 py-2 rounded-md active:bg-stone-300 dark:active:bg-stone-700 ${darkMode ? 'text-stone-400' : 'text-stone-600'}`}>A-</button>
                                        <button onClick={() => setFontSize(Math.min(32, fontSize + 2))} className={`px-4 py-2 rounded-md active:bg-stone-300 dark:active:bg-stone-700 ${darkMode ? 'text-stone-400' : 'text-stone-600'}`}>A+</button>
                                    </div>
                                )}
                                <button onClick={handleNext} disabled={currentIndex === sutraData.length - 1} className={`flex items-center gap-2 px-6 py-3 rounded-full transition font-medium active:scale-95 shadow-lg shadow-amber-900/20 ${currentIndex === sutraData.length - 1 ? 'opacity-0 pointer-events-none' : 'bg-amber-700 text-white'}`}><span>{currentChapterId === 32 ? '圓滿' : '下一品'}</span><Icons.ChevronRight size={20} /></button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
